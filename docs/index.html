<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5B1624">
  <meta name="description" content="Tiendita - acceso para empleados">
  <title>Tiendita</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./logo-192.png">
  <link rel="apple-touch-icon" href="./logo-180.png">
  <link rel="stylesheet" href="./styles.css?v=20" data-tema-css="perla">
  <link rel="stylesheet" href="./styles-diamante.css?v=20" data-tema-css="diamante" media="not all">
  <script src="./tema.js?v=2"></script>
</head>
<body>
  <span data-tema-boton data-flotante></span>

  <div class="login">

    <div class="login__brand">
      <img src="./logo-192.png" alt="" class="login__logo">
      <div class="login__name">TIENDITA</div>
      <div class="login__tagline">llévatelo, paga en quincena</div>
    </div>

    <div class="card login__card">

      <div id="errorBox" class="login__error"></div>

      <label for="email" class="label">Tu correo</label>
      <input
        id="email"
        type="email"
        class="input"
        placeholder="tu.correo@gmail.com"
        autocomplete="email"
        inputmode="email"
        spellcheck="false"
        autocapitalize="off">

      <div id="claveCaja" hidden>
        <div style="height:14px"></div>
        <label for="clave" class="label">Contraseña</label>
        <input id="clave" type="password" class="input" autocomplete="current-password">
      </div>

      <div style="height:14px"></div>

      <button id="btnLogin" class="btn btn--rojo btn--big btn--full">
        Entrar
      </button>

      <p class="login__hint">
        Si todavía no tienes acceso, pide al admin que te dé de alta 💕
      </p>
    </div>

  </div>

  <script src="./api.js?v=12"></script>
  <script src="./app.js?v=13"></script>
  <script>
    tiendita.redirectIfLogged();

    const input    = document.getElementById('email');
    const btn      = document.getElementById('btnLogin');
    const errorBox = document.getElementById('errorBox');
    const claveCaja  = document.getElementById('claveCaja');
    const claveInput = document.getElementById('clave');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('is-visible');
      input.classList.add('input--error');
    }
    function clearError() {
      errorBox.classList.remove('is-visible');
      input.classList.remove('input--error');
    }

    async function intentarLogin() {
      const email = input.value.trim().toLowerCase();
      if (!email || !email.includes('@') || !email.includes('.')) {
        showError('Pon un correo válido.');
        return;
      }
      clearError();
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Entrando...';

      const clave = claveInput.value;
      const res = await api.login(email, clave || undefined);

      if (!res.ok && res.code === 'NEEDS_PIN') {
        // Correo de administración: pide la contraseña en la misma pantalla.
        claveCaja.hidden = false;
        claveInput.focus();
        btn.disabled = false;
        btn.textContent = originalText;
        return;
      }
      if (res.ok && res.usuario && res.usuario.rol === 'admin' && res.token) {
        // Admin: entra al panel de administración.
        try {
          localStorage.setItem('tiendita.sesion.v2', JSON.stringify({ token: res.token, usuario: res.usuario, permisos: res.permisos || [] }));
        } catch (_) {}
        try { tiendita.setSession(res.usuario); } catch (_) {}
        try { TiendiTema.alEntrar(res.usuario.correo); } catch (_) {}
        window.location.href = './admin/';
      } else if (res.ok) {
        tiendita.setSession(res.usuario);
        try { TiendiTema.alEntrar(res.usuario.correo); } catch (_) {}
        window.location.href = './catalogo.html';
      } else {
        showError(res.error || 'No se pudo iniciar sesión.');
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    btn.addEventListener('click', intentarLogin);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') intentarLogin(); });
    claveInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') intentarLogin(); });
    input.addEventListener('input', clearError);
    input.focus();
  </script>

</body>
</html>
