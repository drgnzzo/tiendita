<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E62027">
  <meta name="description" content="Tiendita - acceso para empleados">
  <title>Tiendita</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
  <link rel="stylesheet" href="./styles.css?v=9">
</head>
<body>

  <div class="login">

    <div class="login__brand">
      <img src="./logo.png" alt="" class="login__logo">
      <div class="login__name">TIENDITA</div>
      <div class="login__tagline">llévatelo, paga en quincena</div>
    </div>

    <div class="card login__card">

      <div id="errorBox" class="login__error"></div>

      <label for="email" class="label">Tu correo</label>
      <input
        id="email"
        type="email"
        class="input"
        placeholder="tu.correo@gmail.com"
        autocomplete="email"
        inputmode="email"
        spellcheck="false"
        autocapitalize="off">

      <div style="height:14px"></div>

      <button id="btnLogin" class="btn btn--rojo btn--big btn--full">
        Entrar
      </button>

      <p class="login__hint">
        Si todavía no tienes acceso, pide al admin que te dé de alta 💕
      </p>
    </div>

  </div>

  <script src="./api.js?v=9"></script>
  <script src="./app.js?v=9"></script>
  <script>
    tiendita.redirectIfLogged();

    const input    = document.getElementById('email');
    const btn      = document.getElementById('btnLogin');
    const errorBox = document.getElementById('errorBox');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('is-visible');
      input.classList.add('input--error');
    }
    function clearError() {
      errorBox.classList.remove('is-visible');
      input.classList.remove('input--error');
    }

    async function intentarLogin() {
      const email = input.value.trim().toLowerCase();
      if (!email || !email.includes('@') || !email.includes('.')) {
        showError('Pon un correo válido.');
        return;
      }
      clearError();
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Entrando...';

      const res = await api.login(email);

      if (res.ok) {
        tiendita.setSession(res.usuario);
        window.location.href = './catalogo.html';
      } else {
        showError(res.error || 'No se pudo iniciar sesión.');
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    btn.addEventListener('click', intentarLogin);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') intentarLogin(); });
    input.addEventListener('input', clearError);
    input.focus();
  </script>

</body>
</html>
